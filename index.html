<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' blob:; connect-src 'none'; base-uri 'none'; form-action 'none'; object-src 'none'">
  <meta name="referrer" content="no-referrer">
  <title>Picvert</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <script src="core.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <main>
    <h1>Picvert</h1>
    <noscript>Enable JavaScript to use Picvert.</noscript>
    <form id="image-form" autocomplete="off">
      <fieldset id="controls">
        <label for="file-input">Image</label>
        <input id="file-input" type="file" accept=".png,.jpg,.jpeg,.webp,.gif,.avif,.heic,.heif,.bmp,.tif,.tiff,.ico">
        <label for="passcode">Passcode</label>
        <input id="passcode" type="text" placeholder="A1B2C3" maxlength="1024" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="Passcode, 1 to 6 letters or numbers">
        <div class="actions">
          <button id="encrypt-button" type="submit" disabled>Encrypt</button>
          <button id="restore-button" type="button" disabled>Restore</button>
          <button id="download-button" type="button" disabled>Download</button>
        </div>
      </fieldset>
    </form>
    <p id="status" role="status" aria-live="polite" aria-atomic="true"></p>
    <img id="preview" alt="" hidden>
  </main>
</body>
</html>
